<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Operação HT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- 🎯 OPERAÇÃO HT (26/11/2026 · Bruno: "preciso que o trabalho seja feito por aqui, para que a gente possa acompanhar" · "naquele mesmo design"). A lista vem do robô (rota opHt, só POST) e abre com o mesmo link pessoal da página Leads sem contato ou com a sessão do dash. Nenhum dado de lead fica neste arquivo. -->
<style>
  :root { --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --borda:rgba(255,255,255,.08); --text:#fff; --text2:#9aa3b2; --muted:#6b7380;
    --accent:#f6a350; --green:#3ddc97; --red:#ff6b6b; --yellow:#ffd166; --blue:#6ea8ff; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:min(1480px, 100%); margin:0 auto; padding:32px 16px 72px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .selo { flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:1.5rem; background:radial-gradient(120% 120% at 20% 10%, #fbc07f, #f6a350 45%, #c96a2b); box-shadow:0 14px 36px -14px rgba(246,163,80,.7); }
  .eyebrow { display:block; font-size:.64rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:2px 0 0; font-size:1.6rem; font-weight:900; letter-spacing:-.02em; text-wrap:balance; }
  header p { margin:2px 0 0; color:var(--text2); font-size:.84rem; }
  .topo-d { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button, .bt { font:inherit; cursor:pointer; }
  .b { font-weight:800; font-size:.82rem; border:1px solid var(--borda); border-radius:11px; padding:9px 14px; background:rgba(255,255,255,.06); color:var(--text); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .b:hover { background:rgba(255,255,255,.11); } .b:focus-visible, .chip:focus-visible, .aba:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card { background:var(--panel); border:1px solid var(--borda); border-radius:20px; padding:18px 20px; }
  .card h2 { margin:0 0 10px; font-size:.95rem; font-weight:800; }
  /* placar */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--borda); border-radius:16px; padding:14px 16px; min-width:0; }
  .kpi small { display:block; font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .kpi b { display:block; margin-top:2px; font-size:1.55rem; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .kpi span { display:block; font-size:.74rem; color:var(--text2); }
  .kpi.q b { color:var(--accent); } .kpi.v b { color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:.84rem; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:6px 10px; }
  td { padding:9px 10px; border-top:1px solid var(--borda); } td b { font-weight:800; }
  .rolo { overflow-x:auto; }
  /* quem chamar primeiro */
  .ordem { margin:0; padding:0; list-style:none; counter-reset:p; display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; }
  .ordem li { counter-increment:p; background:var(--panel2); border:1px solid var(--borda); border-radius:14px; padding:12px 14px 12px 46px; position:relative; font-size:.8rem; color:var(--text2); }
  .ordem li::before { content:counter(p); position:absolute; left:12px; top:12px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:.76rem; background:rgba(246,163,80,.16); color:var(--accent); }
  .ordem b { display:block; color:var(--text); font-size:.86rem; }
  /* abas e filtros */
  .abas { display:flex; gap:8px; flex-wrap:wrap; }
  .aba { border:1px solid var(--borda); background:var(--panel); color:var(--text2); font-weight:800; font-size:.84rem; padding:10px 14px; border-radius:12px; display:inline-flex; gap:8px; align-items:center; }
  .aba small { font-size:.72rem; font-weight:800; background:rgba(255,255,255,.07); padding:2px 8px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .aba[aria-selected="true"] { color:var(--text); border-color:rgba(246,163,80,.55); background:linear-gradient(180deg, rgba(246,163,80,.1), rgba(246,163,80,.02)); }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid var(--borda); background:transparent; color:var(--text2); font-weight:700; font-size:.78rem; padding:7px 12px; border-radius:999px; }
  .chip.on { color:#1b1206; background:var(--accent); border-color:var(--accent); }
  input[type=search] { flex:1; min-width:180px; font:inherit; font-size:.86rem; color:var(--text); background:var(--panel); border:1px solid var(--borda); border-radius:12px; padding:9px 14px; }
  /* leads */
  .lista { display:flex; flex-direction:column; gap:8px; }
  .lead { background:var(--panel); border:1px solid var(--borda); border-left:4px solid var(--muted); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 14px; align-items:center; }
  .lead.t1 { border-left-color:var(--red); } .lead.t2 { border-left-color:var(--accent); } .lead.t3 { border-left-color:var(--yellow); } .lead.t4 { border-left-color:var(--blue); } .lead.feito { border-left-color:var(--green); opacity:.72; }
  .lead-n { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; } .lead-n b { font-size:.95rem; font-weight:800; overflow-wrap:anywhere; }
  .tag { font-size:.66rem; font-weight:800; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.07); color:var(--text2); white-space:nowrap; }
  .tag.inv { background:rgba(246,163,80,.16); color:var(--accent); } .tag.alto { background:rgba(255,107,107,.16); color:#ffb4b4; } .tag.nota { background:rgba(110,168,255,.15); color:var(--blue); } .tag.ok { background:rgba(61,220,151,.14); color:var(--green); }
  .lead-f { grid-column:1; display:flex; gap:6px 14px; flex-wrap:wrap; font-size:.76rem; color:var(--text2); }
  .lead-a { grid-row:1 / span 2; grid-column:2; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .b.cl { color:var(--blue); } .b.ab { background:var(--accent); color:#1b1206; border-color:var(--accent); } .b.ab:hover { filter:brightness(1.07); background:var(--accent); } .b.des { color:var(--muted); }
  .b:disabled { opacity:.5; cursor:default; }
  select { font:inherit; font-size:.8rem; font-weight:700; color:var(--text); background:var(--panel); border:1px solid var(--borda); border-radius:11px; padding:8px 10px; max-width:100%; }
  select.on { border-color:rgba(246,163,80,.6); color:var(--accent); }
  .lead-n { cursor:pointer; } .lead-n .ver { font-size:.72rem; font-weight:700; color:var(--muted); }
  .ficha { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; padding-top:10px; border-top:1px dashed var(--borda); }
  .ficha div { background:var(--panel2); border:1px solid var(--borda); border-radius:10px; padding:8px 10px; min-width:0; }
  .ficha small { display:block; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .ficha span { font-size:.8rem; overflow-wrap:anywhere; } .ficha p { grid-column:1 / -1; margin:0; font-size:.8rem; color:var(--text2); }
  .aviso { text-align:center; padding:36px 18px; color:var(--text2); } .aviso b { display:block; color:var(--text); font-size:1.05rem; margin-bottom:6px; }
  .nota { color:var(--muted); font-size:.76rem; }
  @media (max-width:640px) { h1 { font-size:1.3rem; } .lead { grid-template-columns:1fr; } .lead-a { grid-row:auto; grid-column:1; justify-content:flex-start; } .topo-d { margin-left:0; } }
  @media (prefers-reduced-motion:no-preference) { .lead { transition:opacity .2s; } }
  /* 18/11 (Bruno: "coloca uma visualização melhor para mim como gestor"): painel do time no topo */
  .pg { display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:12px; }
  .pp { background:var(--panel); border:1px solid var(--borda); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .pp-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pp-top b { font-size:1.08rem; } .pp-top small { display:block; color:var(--muted); font-size:.72rem; }
  .st { font-size:.7rem; font-weight:800; border-radius:999px; padding:4px 9px; white-space:nowrap; }
  .st.ok { background:rgba(61,220,151,.15); color:var(--green); } .st.meio { background:rgba(255,209,102,.15); color:var(--yellow); } .st.nao { background:rgba(255,107,107,.15); color:#ffb4b4; }
  .barra { height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; } .barra i { display:block; height:100%; background:var(--green); border-radius:99px; }
  .pp-n { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; } .pp-n div { min-width:0; } .pp-n small { display:block; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } .pp-n b { font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .pp-f { font-size:.8rem; color:var(--text2); } .pp-f b { color:var(--text); }
  .pp-pe { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.74rem; color:var(--muted); flex-wrap:wrap; }
  .abd { grid-column:1 / -1; min-width:0; margin-top:2px; background:rgba(246,163,80,.07); border:1px solid rgba(246,163,80,.25); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .abd small { font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); } .abd p { margin:0; font-size:.88rem; line-height:1.5; } .abd p { white-space:pre-line; } .abd-b { display:flex; gap:8px; flex-wrap:wrap; }
  .rot { margin:6px 0 0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px; } .rot li { background:rgba(255,255,255,.03); border:1px solid var(--borda); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; } .rot li > .b { align-self:flex-start; }
  .passo { all:unset; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; } .passo:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; } .passo span { color:var(--muted); } .rot li.on { border-color:rgba(246,163,80,.35); }
  .balao { display:flex; gap:8px; align-items:flex-start; background:rgba(61,220,151,.06); border:1px solid rgba(61,220,151,.18); border-radius:10px 10px 10px 2px; padding:8px 10px; } .balao p { flex:1; margin:0; } .balao .b { flex:none !important; padding:6px 10px; font-size:.74rem; min-height:0 !important; }
  .abd.fechado { background:none; border:0; padding:0; } .b.sug { width:100%; justify-content:space-between; color:var(--accent); border-color:rgba(246,163,80,.35); background:rgba(246,163,80,.07); } .abd-t { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .dic { margin:0; font-size:.78rem; color:var(--text2); white-space:normal; }
  /* 18/11 (Bruno: "coloca a página adaptável"): no celular, números em 2 colunas, abas que deslizam para o lado, filtros em 2 colunas, botões grandes */
  @media (max-width:640px) {
    main { padding:18px 12px 56px; gap:12px; } header { gap:10px; } .selo { width:40px; height:40px; font-size:1.15rem; border-radius:12px; }
    .card { padding:14px; border-radius:16px; } .card h2 { font-size:1rem; }
    .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; } .kpi { padding:10px 12px; border-radius:12px; } .kpi b { font-size:1.25rem; } .kpi span { font-size:.68rem; }
    .pg { grid-template-columns:1fr; } .pp { padding:12px; }
    .abas { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none; } .abas::-webkit-scrollbar { display:none; } .aba { flex:none; padding:9px 12px; font-size:.8rem; }
    .filtros { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); } .filtros input { grid-column:1 / -1; } .filtros select { width:100%; }
    .lead { padding:12px; } .lead-a .b, .abd .b { flex:1 1 auto; justify-content:center; min-height:40px; } .ordem { grid-template-columns:1fr !important; }
    .rot li { padding:10px; } .abd p { font-size:.86rem; }
  }
  /* 18/11 (Bruno: "quero no formato de lista"): os leads ficam um embaixo do outro, em qualquer largura de tela */
</style>
</head>
<body>
<main>
  <header>
    <span class="selo" aria-hidden="true">🎯</span>
    <div><span class="eyebrow">Dash comercial · reta final de novembro</span><h1>Operação HT</h1>
      <p id="sub">Só quem tem perfil de high ticket. Marcar reunião para o dia seguinte, até segunda 30/11.</p></div>
    <div class="topo-d"><button type="button" class="b" id="bAt" onclick="carregar()">↻ Atualizar</button><a class="b" href="./sem-contato.html">Leads sem contato</a><a class="b" href="./">Abrir o dash</a></div>
  </header>
  <div id="corpo"><div class="card aviso"><b>Abrindo a lista…</b>Pode levar alguns segundos.</div></div>
</main>
<script>
  var ROBO = 'https://script.google.com/macros/s/AKfycbxj7EtQMHIB7VSZFh8Fea3uhp10dI2ubIlTy9MEJakGNtfhYilg3v4hyPEJAPi7ydku/exec';
  var CLINT = 'https://app.clint.digital/contacts/';
  var D = null, EST = { de: '', f: 'nao', busca: '', ver: 50, plano: false }, AB = {};
  var esc = function(t) { return String(t == null ? '' : t).replace(/[<>&"]/g, function(c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); };
  function tok() { try { var m = /[#&]k=([^&]+)/.exec(location.hash); if (m) { localStorage.setItem('sdrlLink', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
    return localStorage.getItem('sdrlLink') || localStorage.getItem('comPainelTok') || localStorage.getItem('scoreTok') || ''; } catch (e) { return ''; } }
  function robo(corpo, ok, falha) { fetch(ROBO, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) }).then(function(r) { return r.json(); }).then(ok).catch(function(e) { falha(e && e.message || String(e)); }); }
  function semAcento(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function real(n) { return 'R$ ' + Math.round(n || 0).toLocaleString('pt-BR'); }
  function dia(t) { return new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); }
  function carregar() {
    var t = tok(), c = document.getElementById('corpo');
    if (!t) { c.innerHTML = '<div class="card aviso"><b>Abra pelo seu link pessoal</b>Esta lista abre pelo link que a gestão te mandou, ou para quem já entrou no dash neste navegador.<br><br><a class="b ab" href="./">Abrir o dash e entrar</a></div>'; return; }
    var bt = document.getElementById('bAt'); bt.disabled = true; bt.textContent = 'Atualizando…';
    robo({ action: 'opHt', tok: t }, function(d) {
      bt.disabled = false; bt.textContent = '↻ Atualizar';
      if (!d || !d.success) { c.innerHTML = '<div class="card aviso"><b>' + esc((d && d.error) || 'O robô não respondeu') + '</b>' + (d && d.sair ? '<br><a class="b ab" href="./">Abrir o dash e entrar de novo</a>' : 'Tente de novo em instantes.') + '</div>'; return; }
      D = d; if (!EST.de) EST.de = d.gestor ? 'painel' : d.eu; desenhar();
    }, function(e) { bt.disabled = false; bt.textContent = '↻ Atualizar'; if (D) return; c.innerHTML = '<div class="card aviso"><b>Não consegui falar com o robô</b>' + esc(e) + '</div>'; });
  }
  function feito(p) { return !!(p.marc && p.marc.ok) || !!p.res; }
  function marcou(p) { return !!p.res || (p.marc && p.marc.res === 'Marcou reunião'); }
  function conta(k) { var o = { t: 0, f: 0, m: 0, v: 0, val: 0 }; D.itens.forEach(function(p) { if (p.dono !== k) return; o.t++; if (feito(p)) o.f++; if (marcou(p)) o.m++; if (p.res && p.res.vend) { o.v++; o.val += p.res.valor || 0; } }); return o; }
  function plano() {
    return '<div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer" onclick="EST.plano=!EST.plano;desenhar()">O plano em 1 minuto <span class="nota">' + (EST.plano ? 'fechar ▴' : 'abrir ▾') + '</span></h2>' + (EST.plano ?
      '<ol class="ordem">' +
      '<li><b>Quem escreveu e está sem resposta</b>A pessoa falou com a gente e ninguém respondeu. É a primeira ligação do dia.</li>' +
      '<li><b>Ligar primeiro, mensagem depois</b>A mensagem pronta está em cada lead. Ouro e quente de cima para baixo.</li>' +
      '<li><b>Marcar para o dia seguinte</b>No máximo 2 dias. Para o mesmo dia, de cada 100 só 13 faltam; com 5 dias, faltam 34.</li>' +
      '<li><b>HT vai para Tony e Wesllene</b>Bruno atende na segunda (30/11), só os mais quentes. Segunda com agenda até mais tarde.</li>' +
      '<li><b>Achou caro?</b>Spark Semestral antes de descer para o Legado. Escada: 12x no cartão → 2 ou 3 cartões → entrada + cartão → entrada + recorrente → boleto.</li>' +
      '<li><b>Sem cartão ou limite</b>Selo verde "oferecer boleto": entrada + parcelas no boleto, sem depender de limite.</li>' +
      '</ol><p class="nota" style="margin:10px 0 0">A conta: de cada 100 reuniões de HT marcadas, 61 acontecem; de cada 100 que acontecem, 35 viram venda. Uma venda = 5 reuniões marcadas. Sem condição especial: a urgência é a agenda, que fecha na segunda.</p>' : '') + '</div>';
  }
  function painel() {
    var h = '<div class="pg">';
    Object.keys(D.pessoas).forEach(function(k) { var c = conta(k), P = (D.placar || {})[k] || {}, mt = (D.metas || {})[k] || {}, meta = mt.dia ? mt.dia * 3 : 0, pc = c.t ? Math.round(c.f / c.t * 100) : 0;
      if (!c.t) return;
      var st = P.hoje >= 30 ? ['ok', 'no ritmo'] : P.hoje > 0 ? ['meio', 'começou'] : ['nao', 'parado hoje'];
      h += '<div class="pp" style="cursor:pointer" onclick="de(\'' + k + '\')"><div class="pp-top"><div><b>' + esc(D.pessoas[k]) + '</b><small>' + esc(mt.txt || '') + '</small></div><span class="st ' + st[0] + '">' + st[1] + '</span></div>' +
        '<div class="barra"><i style="width:' + pc + '%"></i></div>' +
        '<div class="pp-n"><div><small>Abordados</small><b>' + c.f + '</b></div><div><small>Hoje</small><b>' + (P.hoje || 0) + '</b></div><div><small>Reuniões</small><b style="color:var(--green)">' + c.m + (meta ? '<span style="font-size:.7rem;color:var(--muted)"> /' + meta + '</span>' : '') + '</b></div></div>' +
        '<div class="pp-f">' + c.f + ' de ' + c.t + ' leads' + (c.v ? ' · <b>' + c.v + ' venda' + (c.v > 1 ? 's' : '') + ' · ' + real(c.val) + '</b>' : '') + '</div>' +
        '<div class="pp-pe"><span>ver os leads →</span><button type="button" class="b" style="padding:5px 9px;font-size:.7rem" onclick="event.stopPropagation();gerarLink(\'' + k + '\')">gerar link</button></div></div>'; });
    return h + '</div><p class="nota" id="lk">Selina, Luana e João Victor entram pelo mesmo link da página Leads sem contato. "Gerar link" cria um link novo para a pessoa e o link antigo dela para de valer.</p>';
  }
  function gerarLink(k) { if (!confirm('Gerar um link novo para ' + D.pessoas[k] + '? Se ela já tem um link, o antigo para de funcionar.')) return;
    robo({ action: 'opHtLink', tok: tok(), quem: k }, function(d) { var e = document.getElementById('lk'); if (!d || !d.success) { e.textContent = (d && d.error) || 'Não consegui gerar.'; return; }
      e.innerHTML = 'Link de <b>' + esc(d.nome) + '</b> (mande só para a pessoa): <input type="search" readonly style="width:100%;margin-top:6px" value="' + esc(d.link) + '" onfocus="this.select()">'; }, function(e2) { document.getElementById('lk').textContent = 'Não consegui gerar: ' + e2; }); }
  function visiveis() { var b = semAcento(EST.busca.trim());
    return D.itens.filter(function(p) { if (p.dono !== EST.de) return false;
      if (EST.f === 'nao' && feito(p)) return false; if (EST.f === 'sim' && !feito(p)) return false; if (EST.f === 'reu' && !marcou(p)) return false;
      if (EST.f === 'top' && !(/OURO|QUENTE/.test(p.cls || '') || p.urg)) return false; if (EST.f === 'bol' && !p.bol) return false;
      if (b && semAcento(p.nome + ' ' + (p.insta || '')).indexOf(b) === -1) return false; return true; })
      .sort(function(a, b2) { return (b2.urg ? 1 : 0) - (a.urg ? 1 : 0) || b2.pri - a.pri; });
  }
  function fichaHtml(p) {
    var h = '<div class="ficha">';
    (p.form || []).forEach(function(x) { h += '<div><small>' + esc(x[0]) + '</small><span>' + esc(x[1]) + '</span></div>'; });
    if (!(p.form || []).length) h += '<p>Não preencheu o formulário.</p>';
    (p.reu || []).forEach(function(x) { h += '<div style="grid-column:1 / -1"><small>Reunião ' + esc(x[0]) + ' · ' + esc(x[1]) + '</small><span><b>' + esc(x[3]) + '</b> · ' + esc(x[2]) + (x[4] ? ' · ' + real(x[4]) : '') + (x[5] ? '<br><span style="color:var(--text2)">Anotação do closer: ' + esc(x[5]) + '</span>' : '') + '</span></div>'; });
    if (p.tipo !== 'ss' && !(p.reu || []).length) h += '<p>Nunca teve reunião.</p>';
    if (p.bio) h += '<div style="grid-column:1 / -1"><small>Bio do Instagram</small><span>' + esc(p.bio) + '</span></div>';
    return h + '</div>';
  }
  function cartao(p) {
    var f = feito(p), tg = '', cls = (p.cls || '').toUpperCase(), t = cls === 'OURO' || cls === 'QUENTE' ? 't1' : cls === 'MORNO' ? 't2' : cls === 'PRATA' ? 't3' : 't4';
    if (cls) tg += '<span class="tag ' + (cls === 'OURO' || cls === 'QUENTE' ? 'alto' : cls === 'MORNO' ? 'inv' : '') + '">' + esc(cls) + '</span>';
    if (p.urg) tg += '<span class="tag alto">escreveu e está sem resposta · ' + esc(p.urg) + '</span>';
    if (p.bol) tg += '<span class="tag ok">sem cartão → oferecer boleto</span>';
    if (p.exc) tg += '<span class="tag nota">exceção: perfil forte</span>';
    if (p.inv) tg += '<span class="tag inv">' + esc(p.inv) + '</span>';
    if (p.seg) tg += '<span class="tag nota">' + Number(p.seg).toLocaleString('pt-BR') + ' seguidores</span>';
    var linha = [];
    if (p.tipo === 'clo') { linha.push(esc(p.sit)); if (p.prod) linha.push(esc(p.prod) + (p.valor ? ' · ' + real(p.valor) : '')); if (p.ult) linha.push('última reunião ' + esc(p.ult)); }
    else if (p.tipo === 'ss') { linha.push(esc(p.insta)); linha.push('comentou "' + esc(p.pal) + '" em ' + esc(p.ult)); }
    else { linha.push(esc(p.sit)); if (p.insta) linha.push(esc(p.insta)); }
    if (p.res) linha.push('<b style="color:var(--green)">reunião ' + dia(p.res.em) + ' com ' + esc(p.res.closer || '—') + ' · ' + esc(p.res.st || '') + (p.res.vend ? ' · ' + real(p.res.valor) : '') + '</b>');
    else if (p.marc && p.marc.ok) linha.push('<span style="color:var(--green)">' + esc(p.marc.res || 'abordado') + ' · ' + esc(p.marc.quem) + ' · ' + dia(p.marc.em) + '</span>');
    var meio = '';
    if (p.tipo === 'clo') meio = '<div class="abd"><small>O que travou</small><p>' + esc(p.travou) + '</p><small>O que fazer</small><p>' + esc(p.fazer) + '</p></div>';
    else meio = (p.pq ? '<div class="lead-f" style="grid-column:1 / -1">' + esc(p.pq) + '</div>' : '') + (p.msg ? '<div class="abd"><div class="abd-t"><small>Mensagem pronta</small><button type="button" class="b" onclick="copiar(this,\'' + p.id + '\',\'msg\')">Copiar</button></div><p>' + esc(p.msg) + '</p>' + (p.msg2 ? '<small>Depois que responder</small><p>' + esc(p.msg2) + '</p>' : '') + '</div>' : '');
    var sel = '<select class="' + (p.marc && p.marc.res ? 'on' : '') + '" onchange="marcar(\'' + p.id + '\',true,this.value)" aria-label="Resultado">' + (D.resultados || ['']).map(function(x) { return '<option value="' + esc(x) + '"' + (p.marc && p.marc.res === x ? ' selected' : '') + '>' + (x || 'Resultado…') + '</option>'; }).join('') + '</select>';
    var bts = (p.fone ? '<button type="button" class="b cl" onclick="copiar(this,\'' + p.id + '\',\'fone\')">' + esc(p.fone.replace(/^55(\d\d)(\d{5})(\d{4})$/, '($1) $2-$3')) + '</button>' : '') +
      (p.link ? '<a class="b cl" href="' + esc(p.link) + '" target="_blank" rel="noopener">Abrir Instagram</a>' : '') +
      (f && !p.res ? '<button type="button" class="b des" onclick="marcar(\'' + p.id + '\',false,\'\')">desfazer</button>' : (!f ? '<button type="button" class="b ab" onclick="marcar(\'' + p.id + '\',true,\'\')">Abordei</button>' : '')) + sel;
    return '<div class="lead ' + t + (f ? ' feito' : '') + '" id="l-' + p.id + '"><div class="lead-n" onclick="abre(\'' + p.id + '\')"><b>' + esc(p.nome || '(sem nome)') + '</b>' + tg + '<span class="ver">' + (AB[p.id] ? 'fechar ficha ▴' : 'ver ficha ▾') + '</span></div><div class="lead-f">' + linha.join(' · ') + '</div><div class="lead-a">' + bts + '</div>' + meio + (AB[p.id] ? fichaHtml(p) : '') + '</div>';
  }
  function desenhar() {
    var c = document.getElementById('corpo'), h = plano();
    if (D.gestor) { h += '<div class="abas" role="tablist"><button type="button" class="aba" role="tab" aria-selected="' + (EST.de === 'painel') + '" onclick="de(\'painel\')">Painel do time</button>';
      Object.keys(D.pessoas).forEach(function(k) { var n = conta(k); if (n.t) h += '<button type="button" class="aba" role="tab" aria-selected="' + (EST.de === k) + '" onclick="de(\'' + k + '\')">' + esc(D.pessoas[k]) + '<small>' + n.f + '/' + n.t + '</small></button>'; }); h += '</div>'; }
    if (EST.de === 'painel') { c.innerHTML = h + painel(); return; }
    var n = conta(EST.de), mt = (D.metas || {})[EST.de] || {}, meta = mt.dia ? mt.dia * 3 : 0, P = (D.placar || {})[EST.de] || {};
    h += '<div class="kpis"><div class="kpi q"><small>Para abordar</small><b>' + (n.t - n.f) + '</b><span>de ' + n.t + ' na sua lista</span></div><div class="kpi"><small>Abordados hoje</small><b>' + (P.hoje || 0) + '</b><span>' + n.f + ' no total</span></div><div class="kpi v"><small>Reuniões marcadas</small><b>' + n.m + (meta ? ' <span style="display:inline;font-size:.9rem;color:var(--muted)">de ' + meta + '</span>' : '') + '</b><span>' + esc(mt.txt || '') + '</span></div><div class="kpi v"><small>Vendas</small><b>' + n.v + '</b><span>' + (n.val ? real(n.val) : 'da planilha de vendas') + '</span></div></div>';
    var ch = [['nao', 'Para abordar'], ['top', 'Ouro, quentes e urgentes'], ['sim', 'Já abordados'], ['reu', 'Reunião marcada'], ['todos', 'Todos']]; if (D.itens.some(function(p) { return p.dono === EST.de && p.bol; })) ch.splice(2, 0, ['bol', 'Sem cartão → boleto']);
    h += '<div class="filtros"><input type="search" id="bs" placeholder="Buscar pelo nome ou @" value="' + esc(EST.busca) + '" oninput="busca(this.value)">' + ch.map(function(x) { return '<button type="button" class="chip' + (EST.f === x[0] ? ' on' : '') + '" onclick="filtro(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join('') + '</div>';
    var L = visiveis();
    h += '<div class="lista">' + L.slice(0, EST.ver).map(cartao).join('') + '</div>' + (!L.length ? '<div class="card aviso"><b>Ninguém neste filtro</b>Troque o filtro acima.</div>' : '') + (L.length > EST.ver ? '<button type="button" class="b" style="align-self:center;margin-top:12px" onclick="EST.ver+=60;desenhar()">Mostrar mais (' + (L.length - EST.ver) + ')</button>' : '');
    c.innerHTML = h;
  }
  function de(k) { EST.de = k; EST.ver = 50; EST.busca = ''; EST.f = 'nao'; desenhar(); scrollTo(0, 0); }
  function filtro(k) { EST.f = k; EST.ver = 50; desenhar(); }
  function busca(v) { EST.busca = v; EST.ver = 50; desenhar(); var i = document.getElementById('bs'); i.focus(); i.setSelectionRange(v.length, v.length); }
  function abre(id) { AB[id] = !AB[id]; desenhar(); }
  function item(id) { return D.itens.filter(function(p) { return p.id === id; })[0]; }
  function copiar(b, id, campo) { var p = item(id), t = campo === 'fone' ? p.fone : p.msg; navigator.clipboard.writeText(t).then(function() { var o = b.textContent; b.textContent = 'Copiado'; setTimeout(function() { b.textContent = o; }, 1300); }); }
  function marcar(id, ok, res) { var p = item(id), antes = p.marc; p.marc = ok || res ? { ok: true, res: res, quem: D.nome, em: Date.now() } : null; desenhar();
    robo({ action: 'opHtMarcar', tok: tok(), id: id, ok: ok, res: res }, function(d) { if (!d || !d.success) { p.marc = antes; desenhar(); alert((d && d.error) || 'Não consegui gravar. Tente de novo.'); } }, function() { p.marc = antes; desenhar(); alert('Sem conexão com o robô. Tente de novo.'); }); }
  carregar();
</script>
