<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Treinamentos Promov</title>
<meta property="og:title" content="Treinamentos Promov">
<meta property="og:description" content="Seus treinamentos liberados pela equipe Promov.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* 30/10/2026 — página do mentorado: só os treinamentos liberados no link. O conteúdo chega cifrado (mentorado/<pessoa>.bin)
   e só abre com a chave que vem no próprio link, depois do #. Mesma identidade do dash: grafite, âmbar, Inter e Barlow Condensed. */
:root{
  --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --linha:rgba(255,255,255,.08); --linha2:rgba(255,255,255,.14);
  --txt:#f4f5f7; --txt2:#9aa3b2; --mudo:#5c6470; --ambar:#f6a350; --ambar2:#ffc58a; --verde:#3ddc97; --verm:#ff6b6b;
  --r:18px; --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --corpo:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--corpo);color:var(--txt);min-height:100vh;
  background:radial-gradient(700px 500px at 8% 6%,rgba(246,163,80,.10),transparent 60%),radial-gradient(800px 600px at 96% 92%,rgba(110,168,255,.07),transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.pg{max-width:1180px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 48px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.marca svg{width:26px;height:30px;fill:var(--ambar);filter:drop-shadow(0 0 10px rgba(246,163,80,.45))}
.marca b{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:18px}
.marca span{font-size:12px;color:var(--txt2);letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--linha2);padding-left:12px}
.eu{font-size:13px;color:var(--txt2)}
.eu b{color:var(--txt);font-weight:600}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1;margin:0 0 8px;letter-spacing:.01em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--ambar)}
.hero p{margin:0;color:var(--txt2);font-size:15px;line-height:1.55;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{position:relative;text-align:left;font:inherit;color:inherit;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--linha);border-radius:var(--r);padding:22px 22px 20px;
  display:flex;flex-direction:column;gap:12px;cursor:pointer;overflow:hidden;transition:border-color .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.card:hover{border-color:rgba(246,163,80,.45);transform:translateY(-2px)}
.card:focus-visible,.btn:focus-visible,.aula:focus-visible,.voltar:focus-visible{outline:2px solid var(--ambar);outline-offset:3px}
.card .num{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--ambar);text-transform:uppercase}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.02}
.card .sub{font-size:13px;color:var(--ambar2)}
.card p{margin:0;color:var(--txt2);font-size:14px;line-height:1.5}
.card .rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px;font-size:13px;color:var(--txt2)}
.card .ir{color:var(--ambar);font-weight:600}
.barra{height:4px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;flex:1;max-width:140px}
.barra i{display:block;height:100%;background:var(--ambar);border-radius:4px}
.card::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(246,163,80,.14),transparent 70%)}
.voltar{align-self:flex-start;font:inherit;font-size:13px;color:var(--txt2);background:none;border:1px solid var(--linha2);border-radius:999px;padding:7px 14px;cursor:pointer}
.voltar:hover{color:var(--txt)}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.cab h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1;margin:6px 0 4px}
.cab .sub{color:var(--ambar2);font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;
  border:1px solid var(--linha2);background:var(--panel2);color:var(--txt)}
.btn:hover{border-color:rgba(246,163,80,.55)}
.btn.forte{background:var(--ambar);border-color:var(--ambar);color:#1a1206}
.btn.feito{background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.45);color:var(--verde)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.leitor{background:var(--panel);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.leitor iframe{display:block;width:100%;height:max(560px,calc(100vh - 230px));border:0;background:#fff}
.paginas{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;background:#22252c;max-height:max(560px,calc(100vh - 230px));overflow:auto}
.paginas .pag{width:100%;max-width:900px;background:#fff;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.35);position:relative}
.paginas canvas{display:block;width:100%;height:auto;border-radius:6px}
.paginas .pag span{position:absolute;right:10px;bottom:8px;font-size:11px;color:#666;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px}
.curso{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.palco{display:flex;flex-direction:column;gap:14px;min-width:0}
.video{position:relative;aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--linha)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.palco h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.palco .mod{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--ambar)}
.navaula{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lista{background:var(--panel);border:1px solid var(--linha);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:16px}
.lista h3{margin:8px 10px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);font-weight:600;display:flex;justify-content:space-between}
.aula{font:inherit;text-align:left;color:inherit;background:none;border:0;border-radius:12px;padding:10px;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.aula:hover{background:rgba(255,255,255,.04)}
.aula.on{background:rgba(246,163,80,.10)}
.aula .bola{width:28px;height:28px;border-radius:50%;border:1px solid var(--linha2);display:flex;align-items:center;justify-content:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--txt2)}
.aula.on .bola{border-color:var(--ambar);color:var(--ambar)}
.aula.vista .bola{background:var(--verde);border-color:var(--verde);color:#062014}
.aula .t{font-size:13.5px;line-height:1.3}
.aula .t small{display:block;color:var(--mudo);font-size:11.5px;margin-top:2px}
.aula .m{font-size:12px;color:var(--mudo);font-variant-numeric:tabular-nums}
.aviso{max-width:560px;margin:10vh auto 0;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.aviso h1{font-family:var(--display);font-weight:800;font-size:38px;margin:0}
.aviso p{margin:0;color:var(--txt2);line-height:1.55}
.nota{color:var(--mudo);font-size:12px;text-align:center;margin-top:8px}
.carregando{display:flex;align-items:center;gap:10px;color:var(--txt2);font-size:14px;padding:30px 0}
.carregando i{width:16px;height:16px;border-radius:50%;border:2px solid var(--linha2);border-top-color:var(--ambar);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.entra{animation:entra .5s cubic-bezier(.22,1,.36,1) both}.entra:nth-child(2){animation-delay:.06s}.entra:nth-child(3){animation-delay:.12s}
  @keyframes entra{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.carregando i{animation:none}}
@media (max-width:880px){.curso{grid-template-columns:1fr}.lista{position:static;max-height:none}}
@media (max-width:520px){.marca span{display:none}.leitor iframe{height:calc(100vh - 200px);min-height:460px}.paginas{padding:10px;max-height:calc(100vh - 190px)}}
</style>
</head>
<body>
<div class="pg" id="pg">
  <div class="carregando" id="carregando"><i></i>Abrindo seus treinamentos…</div>
</div>
<script>
(function () {
  'use strict';
  var MARCA = '<svg viewBox="0 0 88.5 100" aria-hidden="true"><path d="M0 0L3.8 0L88.5 51.9L88.5 54.3L20.7 96.2L18.3 96.2L18.3 80.8L60.3 55.6L62.3 52.6L0 14.4ZM0 20.4L54.3 52.6L53.6 54.8L13.3 78.5L13.3 100L0 100L0 70.7L27.6 53.6L0 35.6Z"/></svg>';
  var IC = {
    abrir: '<svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v7H3V3h7"/></svg>',
    baixar: '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
    doc: '<svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>',
    ok: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'
  };
  var pg = document.getElementById('pg');
  var PASTA = '../mentorado/';
  var D = null, K = null, SLUG = '', ANEXO = {}, ESTADO = { tela: 'inicio', aula: 0 };

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function ler(k, padrao) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } }
  function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function vistas() { return ler('mnt:' + SLUG + ':vistas', {}); }
  function marcar(i, sim) { var v = vistas(); if (sim) v[i] = 1; else delete v[i]; gravar('mnt:' + SLUG + ':vistas', v); }

  function aviso(titulo, texto) {
    pg.replaceChildren();
    var a = el('div', 'aviso');
    var m = el('div'); m.innerHTML = MARCA; m.firstChild.style.width = '34px'; m.firstChild.style.fill = 'var(--ambar)';
    a.append(m, el('h1', null, titulo), el('p', null, texto));
    pg.append(a);
  }
  function b64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function abrirArquivo(nome) {
    return fetch(PASTA + nome, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('fora');
      return r.arrayBuffer();
    }).then(function (buf) {
      var b = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, K, b.slice(12));
    });
  }

  function topo() {
    var t = el('div', 'topo');
    var m = el('div', 'marca'); m.innerHTML = MARCA; m.append(el('b', null, 'PROMOV'), el('span', null, 'Área de treinamento'));
    var eu = el('div', 'eu'); eu.append(document.createTextNode('Acesso de '), el('b', null, D.nome));
    t.append(m, eu);
    return t;
  }
  function rodape() { return el('p', 'nota', 'Material exclusivo de mentorados da Promov. O link é pessoal: não compartilhe.'); }

  function inicio() {
    ESTADO.tela = 'inicio';
    pg.replaceChildren(topo());
    var h = el('div', 'hero');
    var h1 = el('h1'); h1.append(document.createTextNode('Olá, '), el('em', null, D.nome.split(' ')[0]), document.createTextNode('.'));
    h.append(h1, el('p', null, 'Aqui estão os três treinamentos liberados para você: como conduzir a reunião, como qualificar o lead antes dela e como contornar as objeções. Comece pelo que mais faz falta hoje.'));
    pg.append(h);
    var g = el('div', 'cards');
    D.trilhas.forEach(function (t, i) {
      var c = el('button', 'card entra'); c.type = 'button';
      c.append(el('div', 'num', String(i + 1).padStart(2, '0') + ' · ' + (t.tipo === 'curso' ? 'Curso em vídeo' : 'Manual')), el('h2', null, t.nome), el('div', 'sub', t.sub), el('p', null, t.desc));
      var r = el('div', 'rodape');
      if (t.tipo === 'curso') {
        var v = vistas(), n = t.aulas.filter(function (a, j) { return v[j]; }).length;
        var bar = el('div', 'barra'), fill = el('i'); fill.style.width = Math.round((n / t.aulas.length) * 100) + '%'; bar.append(fill);
        var esq = el('span'); esq.style.display = 'flex'; esq.style.alignItems = 'center'; esq.style.gap = '10px'; esq.append(bar, document.createTextNode(n + ' de ' + t.aulas.length));
        r.append(esq, el('span', 'ir', n ? 'Continuar →' : 'Começar →'));
      } else r.append(el('span', null, t.formato === 'pdf' ? 'Leitura em PDF' : 'Leitura interativa'), el('span', 'ir', 'Abrir →'));
      c.append(r);
      c.addEventListener('click', function () { abrirTrilha(t.id); });
      g.append(c);
    });
    pg.append(g, rodape());
    window.scrollTo(0, 0);
  }

  function abrirTrilha(id) {
    var t = D.trilhas.filter(function (x) { return x.id === id; })[0];
    if (!t) return inicio();
    ESTADO.tela = id;
    pg.replaceChildren(topo());
    var v = el('button', 'voltar', '← Todos os treinamentos'); v.type = 'button'; v.addEventListener('click', inicio); pg.append(v);
    if (t.tipo === 'curso') return curso(t);
    var cab = el('div', 'cab'), ct = el('div');
    ct.append(el('h1', null, t.nome), el('div', 'sub', t.sub));
    var ac = el('div', 'acoes');
    cab.append(ct, ac);
    var box = el('div', 'leitor');
    var car = el('div', 'carregando'); car.style.padding = '30px'; car.append(el('i'), document.createTextNode('Abrindo o material…')); box.append(car);
    pg.append(cab, box, rodape());
    window.scrollTo(0, 0);
    obterAnexo(t).then(function (an) {
      if (ESTADO.tela !== id) return;
      var url = an.url;
      if (t.formato === 'pdf') desenharPdf(an.buf, box);
      else { var f = el('iframe'); f.title = t.nome; f.srcdoc = new TextDecoder().decode(an.buf); box.replaceChildren(f); }
      var a1 = el('a', 'btn forte'); a1.href = url; a1.target = '_blank'; a1.rel = 'noopener'; a1.innerHTML = IC.abrir; a1.append(document.createTextNode('Abrir em tela cheia'));
      ac.replaceChildren(a1);
      if (t.formato === 'pdf') { var a2 = el('a', 'btn'); a2.href = url; a2.download = t.nome + '.pdf'; a2.innerHTML = IC.baixar; a2.append(document.createTextNode('Baixar PDF')); ac.append(a2); }
    }).catch(function () { box.replaceChildren(el('div', 'aviso', 'Não consegui abrir este material agora. Recarregue a página.')); });
  }
  function obterAnexo(t) {
    if (ANEXO[t.anexo]) return Promise.resolve(ANEXO[t.anexo]);
    return abrirArquivo(SLUG + '-' + t.anexo + '.bin').then(function (buf) {
      var tipo = t.formato === 'pdf' ? 'application/pdf' : 'text/html;charset=utf-8';
      return (ANEXO[t.anexo] = { buf: buf, url: URL.createObjectURL(new Blob([buf], { type: tipo })) });
    });
  }
  // PDF página a página com o pdf.js (o mesmo do dash): abre igual no celular, no computador e em qualquer navegador
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  function pdfjs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return new Promise(function (ok, erro) {
      var s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
      s.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
      s.onerror = erro; document.head.appendChild(s);
    });
  }
  function desenharPdf(buf, box) {
    pdfjs().then(function (lib) { return lib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise; }).then(function (pdf) {
      var lista = el('div', 'paginas'); box.replaceChildren(lista);
      var feitas = {}, obs = null;
      function desenhar(n, caixa) {
        if (feitas[n]) return; feitas[n] = 1;
        pdf.getPage(n).then(function (pag) {
          var larg = Math.max(320, caixa.clientWidth || 800), v1 = pag.getViewport({ scale: 1 });
          var esc = (larg / v1.width) * Math.min(2, window.devicePixelRatio || 1), vp = pag.getViewport({ scale: esc });
          var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
          caixa.style.aspectRatio = ''; caixa.prepend(c);
          return pag.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        }).catch(function () { feitas[n] = 0; });
      }
      if ('IntersectionObserver' in window) obs = new IntersectionObserver(function (ents) { ents.forEach(function (e) { if (e.isIntersecting) desenhar(+e.target.dataset.n, e.target); }); }, { root: lista, rootMargin: '600px 0px' });
      for (var n = 1; n <= pdf.numPages; n++) {
        var caixa = el('div', 'pag'); caixa.dataset.n = n; caixa.style.aspectRatio = '210 / 297';
        caixa.append(el('span', null, n + ' / ' + pdf.numPages));
        lista.append(caixa);
        if (obs) obs.observe(caixa); else desenhar(n, caixa);
      }
    }).catch(function () {
      var f = el('iframe'); f.title = 'Manual'; f.src = ANEXO.closer ? ANEXO.closer.url : ''; box.replaceChildren(f);   // sem o pdf.js: o leitor do próprio navegador
    });
  }

  function curso(t) {
    var cab = el('div', 'cab'), ct = el('div');
    ct.append(el('h1', null, t.nome), el('div', 'sub', t.sub));
    cab.append(ct);
    var g = el('div', 'curso'), palco = el('div', 'palco'), lista = el('div', 'lista');
    g.append(palco, lista);
    pg.append(cab, g, rodape());
    var ult = ler('mnt:' + SLUG + ':aula', 0);
    mostrar(Math.min(Math.max(0, ult), t.aulas.length - 1), true);

    function desenharLista() {
      var v = vistas(), n = t.aulas.filter(function (a, j) { return v[j]; }).length;
      lista.replaceChildren();
      var h3 = el('h3'); h3.append(el('span', null, 'Módulos'), el('span', null, n + ' de ' + t.aulas.length + ' vistos')); lista.append(h3);
      t.aulas.forEach(function (a, i) {
        var b = el('button', 'aula' + (i === ESTADO.aula ? ' on' : '') + (v[i] ? ' vista' : '')); b.type = 'button';
        var bola = el('span', 'bola'); if (v[i]) bola.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" style="stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="m5 12 5 5 9-10"/></svg>'; else bola.textContent = String(i).padStart(2, '0');
        var tt = el('span', 't', a.titulo); tt.append(el('small', null, a.modulo));
        b.append(bola, tt, el('span', 'm', a.min + ' min'));
        b.addEventListener('click', function () { mostrar(i); });
        lista.append(b);
      });
    }
    function mostrar(i, inicial) {
      ESTADO.aula = i; gravar('mnt:' + SLUG + ':aula', i);
      var a = t.aulas[i];
      palco.replaceChildren();
      var vd = el('div', 'video'), f = el('iframe');
      f.src = 'https://drive.google.com/file/d/' + encodeURIComponent(a.video) + '/preview';
      f.title = a.modulo + ' · ' + a.titulo; f.allow = 'autoplay; fullscreen'; f.setAttribute('allowfullscreen', '');
      vd.append(f);
      var info = el('div'); info.append(el('div', 'mod', a.modulo + ' · ' + a.min + ' min'), el('h2', null, a.titulo));
