<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Relatório dos Funis</title>
<style>html,body{margin:0;height:100%;background:#0c0e12;color:#e9ecf2;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.c{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.c b{display:block;font-size:1.15rem;margin-bottom:6px}.c span{color:#9aa3b2}</style></head>
<body><div class="c" id="aviso"><div><b>Abrindo o Relatório dos Funis…</b><span>Um instante.</span></div></div>
<script>
// Página que abre o relatório cifrado (relatorio/funis.bin). A chave vem no endereço, depois de "#k=", pelo botão da aba Gestão de funis do dash.
// Depois de aberta, a chave fica só nesta aba do navegador (para o "recarregar" funcionar) e sai do endereço.
(function () {
  function erro(t, s) { document.getElementById('aviso').innerHTML = '<div><b>' + t + '</b><span>' + s + '</span></div>'; }
  var m = /[#&]k=([A-Za-z0-9_-]{16,})/.exec(location.hash || ''), k = m ? m[1] : '';
  try { if (k) sessionStorage.setItem('rel-funis-k', k); else k = sessionStorage.getItem('rel-funis-k') || ''; } catch (e) {}
  if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (!k) return erro('Abra o relatório pelo dash', 'Entre no dash, vá em Gestão de funis e toque em "Relatório dos Funis".');
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) return erro('Este navegador é antigo para abrir o relatório', 'Atualize o navegador ou abra pelo computador.');
  function b64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  fetch('relatorio/funis.bin?' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('sem arquivo'); return r.arrayBuffer(); })
    .then(function (buf) { var b = new Uint8Array(buf); return crypto.subtle.importKey('raw', b64url(k), 'AES-GCM', false, ['decrypt']).then(function (K) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, K, b.slice(12)); }); })
    .then(function (z) { return new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); })
    .then(function (h) { document.open(); document.write(h); document.close(); })
    .catch(function (e) { try { sessionStorage.removeItem('rel-funis-k'); } catch (x) {} erro('Não consegui abrir o relatório', 'Volte ao dash e toque de novo em "Relatório dos Funis". Se continuar, avise o Bruno.'); });
})();
</script></body></html>
