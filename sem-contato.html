<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Leads sem contato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- 📋 LEADS SEM CONTATO DO TIME (17/11/2026 · Bruno: "queria uma página criada somente para isso ao invés de uma planilha · que abre na
     Clint e no Lead Center" · "mostra o da Sarah para os dois e explica quem chamar primeiro"). A lista vem do robô (rota sdrLista, só POST)
     e só abre para quem já entrou no dash: a página usa a mesma sessão que o dash guarda neste navegador. Nenhum dado de lead fica neste arquivo. -->
<style>
  :root { --bg:#0c0e12; --panel:#14171d; --panel2:#1a1e26; --borda:rgba(255,255,255,.08); --text:#fff; --text2:#9aa3b2; --muted:#6b7380;
    --accent:#f6a350; --green:#3ddc97; --red:#ff6b6b; --yellow:#ffd166; --blue:#6ea8ff; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1040px; margin:0 auto; padding:32px 16px 72px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .selo { flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font-size:1.5rem; background:radial-gradient(120% 120% at 20% 10%, #fbc07f, #f6a350 45%, #c96a2b); box-shadow:0 14px 36px -14px rgba(246,163,80,.7); }
  .eyebrow { display:block; font-size:.64rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:2px 0 0; font-size:1.6rem; font-weight:900; letter-spacing:-.02em; text-wrap:balance; }
  header p { margin:2px 0 0; color:var(--text2); font-size:.84rem; }
  .topo-d { margin-left:auto; display:flex; gap:8px; align-items:center; }
  button, .bt { font:inherit; cursor:pointer; }
  .b { font-weight:800; font-size:.82rem; border:1px solid var(--borda); border-radius:11px; padding:9px 14px; background:rgba(255,255,255,.06); color:var(--text); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .b:hover { background:rgba(255,255,255,.11); } .b:focus-visible, .chip:focus-visible, .aba:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card { background:var(--panel); border:1px solid var(--borda); border-radius:20px; padding:18px 20px; }
  .card h2 { margin:0 0 10px; font-size:.95rem; font-weight:800; }
  /* placar */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--borda); border-radius:16px; padding:14px 16px; min-width:0; }
  .kpi small { display:block; font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .kpi b { display:block; margin-top:2px; font-size:1.55rem; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .kpi span { display:block; font-size:.74rem; color:var(--text2); }
  .kpi.q b { color:var(--accent); } .kpi.v b { color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:.84rem; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:6px 10px; }
  td { padding:9px 10px; border-top:1px solid var(--borda); } td b { font-weight:800; }
  .rolo { overflow-x:auto; }
  /* quem chamar primeiro */
  .ordem { margin:0; padding:0; list-style:none; counter-reset:p; display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; }
  .ordem li { counter-increment:p; background:var(--panel2); border:1px solid var(--borda); border-radius:14px; padding:12px 14px 12px 46px; position:relative; font-size:.8rem; color:var(--text2); }
  .ordem li::before { content:counter(p); position:absolute; left:12px; top:12px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:.76rem; background:rgba(246,163,80,.16); color:var(--accent); }
  .ordem b { display:block; color:var(--text); font-size:.86rem; }
  /* abas e filtros */
  .abas { display:flex; gap:8px; flex-wrap:wrap; }
  .aba { border:1px solid var(--borda); background:var(--panel); color:var(--text2); font-weight:800; font-size:.84rem; padding:10px 14px; border-radius:12px; display:inline-flex; gap:8px; align-items:center; }
  .aba small { font-size:.72rem; font-weight:800; background:rgba(255,255,255,.07); padding:2px 8px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .aba[aria-selected="true"] { color:var(--text); border-color:rgba(246,163,80,.55); background:linear-gradient(180deg, rgba(246,163,80,.1), rgba(246,163,80,.02)); }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid var(--borda); background:transparent; color:var(--text2); font-weight:700; font-size:.78rem; padding:7px 12px; border-radius:999px; }
  .chip.on { color:#1b1206; background:var(--accent); border-color:var(--accent); }
  input[type=search] { flex:1; min-width:180px; font:inherit; font-size:.86rem; color:var(--text); background:var(--panel); border:1px solid var(--borda); border-radius:12px; padding:9px 14px; }
  /* leads */
  .lista { display:flex; flex-direction:column; gap:8px; }
  .lead { background:var(--panel); border:1px solid var(--borda); border-left:4px solid var(--muted); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 14px; align-items:center; }
  .lead.t1 { border-left-color:var(--red); } .lead.t2 { border-left-color:var(--accent); } .lead.t3 { border-left-color:var(--yellow); } .lead.t4 { border-left-color:var(--blue); } .lead.feito { border-left-color:var(--green); opacity:.72; }
  .lead-n { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; } .lead-n b { font-size:.95rem; font-weight:800; overflow-wrap:anywhere; }
  .tag { font-size:.66rem; font-weight:800; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.07); color:var(--text2); white-space:nowrap; }
  .tag.inv { background:rgba(246,163,80,.16); color:var(--accent); } .tag.alto { background:rgba(255,107,107,.16); color:#ffb4b4; } .tag.nota { background:rgba(110,168,255,.15); color:var(--blue); } .tag.ok { background:rgba(61,220,151,.14); color:var(--green); }
  .lead-f { grid-column:1; display:flex; gap:6px 14px; flex-wrap:wrap; font-size:.76rem; color:var(--text2); }
  .lead-a { grid-row:1 / span 2; grid-column:2; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .b.cl { color:var(--blue); } .b.ab { background:var(--accent); color:#1b1206; border-color:var(--accent); } .b.ab:hover { filter:brightness(1.07); background:var(--accent); } .b.des { color:var(--muted); }
  .b:disabled { opacity:.5; cursor:default; }
  select { font:inherit; font-size:.8rem; font-weight:700; color:var(--text); background:var(--panel); border:1px solid var(--borda); border-radius:11px; padding:8px 10px; max-width:100%; }
  select.on { border-color:rgba(246,163,80,.6); color:var(--accent); }
  .lead-n { cursor:pointer; } .lead-n .ver { font-size:.72rem; font-weight:700; color:var(--muted); }
  .ficha { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:8px; padding-top:10px; border-top:1px dashed var(--borda); }
  .ficha div { background:var(--panel2); border:1px solid var(--borda); border-radius:10px; padding:8px 10px; min-width:0; }
  .ficha small { display:block; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .ficha span { font-size:.8rem; overflow-wrap:anywhere; } .ficha p { grid-column:1 / -1; margin:0; font-size:.8rem; color:var(--text2); }
  .aviso { text-align:center; padding:36px 18px; color:var(--text2); } .aviso b { display:block; color:var(--text); font-size:1.05rem; margin-bottom:6px; }
  .nota { color:var(--muted); font-size:.76rem; }
  @media (max-width:640px) { h1 { font-size:1.3rem; } .lead { grid-template-columns:1fr; } .lead-a { grid-row:auto; grid-column:1; justify-content:flex-start; } .topo-d { margin-left:0; } }
  @media (prefers-reduced-motion:no-preference) { .lead { transition:opacity .2s; } }
  /* 18/11 (Bruno: "coloca uma visualização melhor para mim como gestor"): painel do time no topo */
  .pg { display:grid; grid-template-columns:repeat(auto-fit, minmax(215px, 1fr)); gap:12px; }
  .pp { background:var(--panel); border:1px solid var(--borda); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .pp-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .pp-top b { font-size:1.08rem; } .pp-top small { display:block; color:var(--muted); font-size:.72rem; }
  .st { font-size:.7rem; font-weight:800; border-radius:999px; padding:4px 9px; white-space:nowrap; }
  .st.ok { background:rgba(61,220,151,.15); color:var(--green); } .st.meio { background:rgba(255,209,102,.15); color:var(--yellow); } .st.nao { background:rgba(255,107,107,.15); color:#ffb4b4; }
  .barra { height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; } .barra i { display:block; height:100%; background:var(--green); border-radius:99px; }
  .pp-n { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; } .pp-n div { min-width:0; } .pp-n small { display:block; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } .pp-n b { font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .pp-f { font-size:.8rem; color:var(--text2); } .pp-f b { color:var(--text); }
  .pp-pe { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.74rem; color:var(--muted); flex-wrap:wrap; }
  .abd { grid-column:1 / -1; min-width:0; margin-top:2px; background:rgba(246,163,80,.07); border:1px solid rgba(246,163,80,.25); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .abd small { font-size:.62rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); } .abd p { margin:0; font-size:.88rem; line-height:1.5; } .abd p { white-space:pre-line; } .abd-b { display:flex; gap:8px; flex-wrap:wrap; }
  .rot { margin:6px 0 0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px; } .rot li { background:rgba(255,255,255,.03); border:1px solid var(--borda); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; } .rot li > .b { align-self:flex-start; }
  .dic { margin:0; font-size:.78rem; color:var(--text2); white-space:normal; }
</style>
</head>
<body>
<main>
  <header>
    <span class="selo" aria-hidden="true">📋</span>
    <div><span class="eyebrow">Dash comercial · rotina do SDR</span><h1>Leads sem contato do time</h1>
      <p id="sub">Quem chegou no SPARK / GROWTH e ainda não recebeu mensagem de uma pessoa.</p></div>
    <div class="topo-d"><button type="button" class="b" id="bAt" onclick="carregar(true)">↻ Atualizar</button><a class="b" href="./">Abrir o dash</a></div>
  </header>
  <div id="corpo"><div class="card aviso"><b>Abrindo a lista…</b>A primeira vez pode levar até 1 minuto. Pode deixar a página aberta.</div></div>
</main>
<script>
  var ROBO = 'https://script.google.com/macros/s/AKfycbxj7EtQMHIB7VSZFh8Fea3uhp10dI2ubIlTy9MEJakGNtfhYilg3v4hyPEJAPi7ydku/exec';
  var CLINT = 'https://app.clint.digital/contacts/', LEADC = 'https://leads.legado.club/ir/contacts/';
  var D = null, EST = { lista: 'sdr', aba: 'ev', de: 'todos', busca: '', ver: 60, inv: '', nota: '', etapa: '', idade: '' }, FICHAS = {}, ABERTAS = {};
  var esc = function(t) { return String(t == null ? '' : t).replace(/[<>&"]/g, function(c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); };
  // 17/11 (Bruno: "quero acesso sem precisar entrar no dash"): link pessoal (…#k=lk:quem.segredo). Fica guardado neste navegador e sai do endereço.
  function tok() { try { var m = /[#&]k=([^&]+)/.exec(location.hash); if (m) { localStorage.setItem('sdrlLink', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
    return localStorage.getItem('sdrlLink') || localStorage.getItem('comPainelTok') || localStorage.getItem('scoreTok') || ''; } catch (e) { return ''; } }
  function robo(corpo, ok, falha) {
    fetch(ROBO, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
      .then(function(r) { return r.json(); }).then(ok).catch(function(e) { falha(e && e.message || String(e)); });
  }
  var FX = { 4: 'R$ 3 a 4 mil', 3: 'R$ 2 a 3 mil', 2: 'R$ 500 a 1 mil', 1: 'R$ 500' };
  var ATIVA = /base ia|conex|qualifica|pre agend|reuniao/;
  function semAcento(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  // QUEM CHAMAR PRIMEIRO: 1 investimento alto · 2 MQL em etapa ativa · 3 MQL nota A ou B · 4 demais MQL · depois, pela nota e do mais novo para o mais antigo
  function faixa(p) { if (p.nv >= 3) return 1; if (p.nv && ATIVA.test(semAcento(p.etapa))) return 2; if (p.nv && /^[AB]$/.test(p.nota)) return 3; if (p.nv) return 4; return 5; }
  function ordem(a, b) { var n = function(p) { return { A: 0, B: 1, C: 2, D: 3 }[p.nota] == null ? 4 : { A: 0, B: 1, C: 2, D: 3 }[p.nota]; }; return faixa(a) - faixa(b) || b.nv - a.nv || n(a) - n(b) || b.cr - a.cr; }
  function grupo(p) { if (p.res) return 'reu'; if (p.marc || p.ct) return 'feitos'; if (p.ev) return 'ev'; if (p.rec) return (p.grp === 'workshop' || p.grp === 'ild') ? 'ev' : p.pt >= 70 ? 'q' : p.pt >= 50 ? 'm' : 'fr'; return p.nv ? 'mql' : p.form === 'Completo' ? 'comp' : 'inc'; }
  function ha(t) { var d = Math.floor((Date.now() - t) / 864e5); return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : 'há ' + d + ' dias'; }
  function hora(t) { var d = new Date(t); return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function nomeDe(k) { return k === 'time' ? 'Do time (Sarah e sem dono)' : (D && D.nomes && D.nomes[k]) || k.charAt(0).toUpperCase() + k.slice(1); }
  function carregar(forcar) {
    var t = tok(), c = document.getElementById('corpo');
    if (!t) { c.innerHTML = '<div class="card aviso"><b>Abra pelo seu link pessoal</b>Esta lista abre pelo link que a gestão te mandou, ou para quem já entrou no dash neste navegador.<br><br><a class="b ab" href="./">Abrir o dash e entrar</a></div>'; return; }
    var bt = document.getElementById('bAt'); bt.disabled = true; bt.textContent = 'Atualizando…';
    if (!D) { try { var gu = JSON.parse(localStorage.getItem('sdrlCache') || 'null'); if (gu && gu.t === t && Date.now() - gu.em < 12 * 3600e3 && gu.d && gu.d.leads) { D = gu.d; D.porLink = /^lk:/.test(t); D.rec = D.rec || []; D.guardada = gu.em; if (!D.gestor) EST.lista = D.rec.indexOf(D.eu) !== -1 ? 'rec' : 'sdr'; desenhar(); } } catch (eG) {} }
    var demora = setTimeout(function() { if (!D) c.innerHTML = '<div class="card aviso"><b>Ainda montando a lista…</b>O robô está lendo as conversas. Falta pouco: não precisa recarregar.</div>'; }, 25000);
    robo({ action: 'sdrLista', tok: t }, function(d) {
      clearTimeout(demora); bt.disabled = false; bt.textContent = '↻ Atualizar';
      if (!d || !d.success) { c.innerHTML = '<div class="card aviso"><b>' + esc((d && d.error) || 'O robô não respondeu') + '</b>' + (d && d.sair ? '<br><a class="b ab" href="./">Abrir o dash e entrar de novo</a>' : 'Tente de novo em instantes.') + '</div>'; return; }
      try { localStorage.setItem('sdrlCache', JSON.stringify({ t: t, em: Date.now(), d: d })); } catch (eS) { try { localStorage.removeItem('sdrlCache'); } catch (eR) {} }
      D = d; D.porLink = /^lk:/.test(t); D.rec = d.rec || []; if (!d.gestor) EST.lista = d.leads.some(function(p) { return p.rec; }) && !d.leads.some(function(p) { return !p.rec; }) || D.rec.indexOf(d.eu) !== -1 ? 'rec' : 'sdr';
      desenhar();
    }, function(e) { clearTimeout(demora); bt.disabled = false; bt.textContent = '↻ Atualizar'; if (D && D.leads) return; c.innerHTML = '<div class="card aviso"><b>Não consegui falar com o robô</b>' + esc(e) + '</div>'; });
  }
  function visiveis() {
    var b = semAcento(EST.busca.trim());
    return D.leads.filter(function(p) {
      if (!!p.rec !== (EST.lista === 'rec')) return false;
      if (EST.de !== 'todos' && p.dono !== EST.de) return false;
      if (b && semAcento(p.nome).indexOf(b) === -1) return false;
      if (EST.inv !== '' && String(p.nv) !== EST.inv && !(EST.inv === 'mql' && p.nv > 0) && !(EST.inv === 'alto' && p.nv >= 3)) return false;
      if (EST.nota !== '' && (p.nota || '-') !== EST.nota) return false;
      if (EST.etapa !== '' && (p.etapa || '—') !== EST.etapa) return false;
      if (EST.idade !== '') { var d = (Date.now() - p.cr) / 864e5, fx = d <= 7 ? '7' : d <= 30 ? '30' : d <= 90 ? '90' : '99'; if (fx !== EST.idade) return false; }
      return true; });
  }
  function sair() { try { localStorage.removeItem('sdrlLink'); localStorage.removeItem('sdrlCache'); } catch (e) {} location.href = location.pathname; }
  function lista(k) { EST.lista = k; EST.aba = 'ev'; EST.de = 'todos'; EST.ver = 60; limparSem(); desenhar(); }
  function limparSem() { EST.inv = EST.nota = EST.etapa = EST.idade = ''; }
  // 18/11: painel do gestor — uma ficha por pessoa (os 2 SDRs e os 2 da recuperação), com o que fez hoje, o andamento e os resultados
  function painelGestor() {
    var hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
    var gente = (D.sdrs || []).map(function(k) { return [k, 'Lista dos SDRs']; }).concat((D.rec || []).map(function(k) { return [k, 'Recuperação']; }));
    var T = { pend: 0, hoje: 0, reu: 0, comp: 0, vend: 0, valor: 0 };
    var cards = gente.map(function(g) {
      var k = g[0], P = D.placar[k] || {}, a = (D.acessos || {})[k], feitos = (P.feitos || 0) + (P.vistos || 0), tot = feitos + (P.pendentes || 0), pc = tot ? Math.round(100 * feitos / tot) : 0;
      T.pend += P.pendentes || 0; T.hoje += P.feitosHoje || 0; T.reu += P.reunioes || 0; T.comp += P.compareceram || 0; T.vend += P.vendas || 0; T.valor += P.valor || 0;
      var st = (P.feitosHoje || 0) > 0 ? '<span class="st ok">✅ trabalhando hoje</span>' : a && a.hoje ? '<span class="st meio">🟡 abriu, sem abordar</span>' : '<span class="st nao">🔴 não entrou hoje</span>';
      return '<div class="pp"><div class="pp-top"><div><b>' + esc(nomeDe(k)) + '</b><small>' + g[1] + '</small></div>' + st + '</div>'
        + '<div><div class="barra" title="' + pc + '% da lista trabalhada"><i style="width:' + pc + '%"></i></div><div class="pp-f" style="margin-top:4px"><b>' + pc + '%</b> da lista trabalhada · ' + feitos + ' de ' + tot + '</div></div>'
        + '<div class="pp-n"><div><small>Para chamar</small><b style="color:var(--accent)">' + (P.pendentes || 0) + '</b></div><div><small>Hoje</small><b>' + (P.feitosHoje || 0) + '</b></div><div><small>Pela Clint</small><b>' + (P.vistos || 0) + '</b></div></div>'
        + '<div class="pp-f">📅 <b>' + (P.reunioes || 0) + '</b> reuniões → <b>' + (P.compareceram || 0) + '</b> compareceram → 💰 <b>' + (P.vendas || 0) + '</b> vendas' + (P.vendas ? ' · ' + rs(P.valor) : '') + '</div>'
        + '<div class="pp-pe"><span>Última entrada: ' + (a && a.ultima ? hora(a.ultima) : 'nunca') + '</span><button type="button" class="chip" onclick="gerarLink(\'' + k + '\')">' + ((D.links || {})[k] ? '🔗 Trocar link' : '🔗 Gerar link') + '</button></div></div>';
    }).join('');
    var tm = D.placar.time || {};
    return '<div class="card"><h2>Painel do time</h2><div class="kpis" style="margin:10px 0 14px">'

    if (ab) h += '<ol class="rot">' + R.map(function(x, i) { return '<li><b>' + esc(x[0]) + '</b>' + (i ? '<p id="abd-' + id + '-' + i + '">' + esc(x[1]) + '</p><button type="button" class="b" onclick="copiarMsg(\'' + id + '-' + i + '\', this)">Copiar</button>' : '<p class="dic">A 1ª mensagem está acima.</p>') + '<p class="dic">💡 ' + esc(x[2]) + '</p></li>'; }).join('') + '</ol><p class="dic">Uma mensagem de cada vez: espere a resposta antes da próxima. Se faltar tração ou urgência, corte com gentileza: "Acho mais honesto a gente se falar mais pra frente. Posso te mandar conteúdos e retomar na hora certa? Deus abençoe! 🙏"</p>';
    return h + '</div>';
  }
  function verRot(id) { if (ROT[id]) delete ROT[id]; else ROT[id] = 1; desenhar(); }
  function copiarMsg(id, bt) { var el = document.getElementById('abd-' + id); if (!el) return; var t = el.textContent, o = bt.textContent, ok = function() { bt.textContent = '✅ Copiada'; setTimeout(function() { bt.textContent = o; }, 2000); };
    try { navigator.clipboard.writeText(t).then(ok, function() { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }); } catch (e) {} }
  function copiar() { var t = document.getElementById('lkTxt').textContent; try { navigator.clipboard.writeText(t); } catch (e) {} }
  function fichaHtml(p) {
    var f = FICHAS[p.id];
    if (!f) return '<div class="ficha"><p>Buscando as respostas do formulário…</p></div>';
    if (f.erro) return '<div class="ficha"><p>' + esc(f.erro) + '</p></div>';
    if (f.semTelefone) return '<div class="ficha"><p>Este lead não tem telefone na lista, então não dá para achar o formulário dele. Abra na Clint ou no Lead Center.</p></div>';
    if (!f.vezes) return '<div class="ficha"><p>Não achei formulário deste telefone: o lead entrou por outro caminho (anúncio direto no WhatsApp, indicação ou cadastro manual).</p></div>';
    return '<div class="ficha">' + f.respostas.map(function(r) { return '<div><small>' + esc(r[0]) + '</small><span>' + esc(r[1]) + '</span></div>'; }).join('') + '<p>Preenchido em ' + esc(f.em || '—') + (f.vezes > 1 ? ' · preencheu ' + f.vezes + ' vezes (estas são as respostas mais recentes)' : '') + '</p></div>';
  }
  function ficha(id) {
    if (ABERTAS[id]) { delete ABERTAS[id]; desenhar(); return; }
    ABERTAS[id] = 1; desenhar();
    if (FICHAS[id]) return;
    robo({ action: 'sdrFicha', tok: tok(), id: id }, function(d) { FICHAS[id] = d && d.success ? d : { erro: (d && d.error) || 'Não consegui buscar as respostas.' }; if (ABERTAS[id]) desenhar(); },
      function() { FICHAS[id] = { erro: 'Não consegui falar com o robô. Feche e abra de novo.' }; if (ABERTAS[id]) desenhar(); });
  }
  function filtro(k, v) { EST[k] = v; EST.ver = 60; desenhar(); }
  function limpar() { EST.inv = EST.nota = EST.etapa = EST.idade = ''; EST.ver = 60; desenhar(); }
  function aba(k) { EST.aba = k; EST.ver = 60; desenhar(); }
  function de(k) { EST.de = k; EST.ver = 60; desenhar(); }
  function busca(v) { EST.busca = v; EST.ver = 60; var s = document.activeElement, pos = s && s.selectionStart; desenhar(); var i = document.querySelector('input[type=search]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} } }
  function mais() { EST.ver += 60; desenhar(); }
  function marcar(bt, id, tipo) {
    var irm = bt.parentNode.querySelectorAll('button'); irm.forEach(function(b) { b.disabled = true; });
    robo({ action: 'sdrMarcar', tok: tok(), id: id, tipo: tipo }, function(d) {
      if (!d || !d.success) { irm.forEach(function(b) { b.disabled = false; }); alert((d && d.error) || 'Não consegui gravar. Tente de novo.'); return; }
      D.leads.forEach(function(p) { if (p.id === id) p.marc = d.marc; }); desenhar();
    }, function() { irm.forEach(function(b) { b.disabled = false; }); alert('Não consegui falar com o robô. Tente de novo.'); });
  }
  carregar(false);
</script>
